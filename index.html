<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Masters</title>
    <link rel="stylesheet" href="coffee.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">☕ Coffee Masters</div>
    </header>

    <main class="container">
      <!-- LEFT -->
      <section class="card items-card">
        <h3>ITEMS</h3>

        <div class="item">
          <div class="qty">1x</div>

          <div class="details">
            <h4>Cappuccino</h4>
            <p>Lite foam</p>
          </div>

          <div class="price">$8.15</div>
        </div>

        <div class="divider"></div>

        <div class="item">
          <div class="qty">1x</div>

          <div class="details">
            <h4>Cappuccino</h4>
            <p>Lite milk</p>
            <p>Double espresso</p>
          </div>

          <div class="price">$5.05</div>
        </div>

        <div class="divider"></div>

        <div class="item">
          <div class="qty">1x</div>

          <div class="details">
            <h4>Croissant</h4>
            <p>Butter</p>
          </div>

          <div class="price">$12.5</div>
        </div>
      </section>

      <!-- RIGHT -->
      <section class="right-column">
        <div class="card form-card">
          <h3>NAME</h3>

          <div class="input-group">
            <label>Name for order</label>
            <input type="text" value="mazda demio car" />
          </div>
        </div>

        <div class="card form-card">
          <h3>PAYMENT</h3>

          <div class="input-group">
            <label>Card number</label>
            <input type="text" value="353535357276623" />
          </div>

          <div class="input-group small">
            <label>CCV Number</label>
            <input type="text" value="1010" />
          </div>
        </div>
      </section>
    </main>

    <!-- TOTALS -->
    <section class="totals">
      <div class="row">
        <span>Subtotal:</span>
        <span>$9.65</span>
      </div>

      <div class="row">
        <span>Tax:</span>
        <span>$0.82</span>
      </div>

      <div class="row total">
        <span>Total:</span>
        <span>$10.47</span>
      </div>
    </section>

    <div class="button-wrapper">
      <button>Place order</button>
    </div>
  </body>
</html>
